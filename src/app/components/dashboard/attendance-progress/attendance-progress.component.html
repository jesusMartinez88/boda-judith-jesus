<div class="stats-card progress-card" *ngIf="totalEstimatedGuests() > 0">
    <div class="progress-info">
        <h3>Progreso de Confirmación</h3>
        <p class="progress-value">{{ stats()?.confirmed || 0 }} / {{ totalEstimatedGuests() }}</p>
        <div class="progress-legend">
            <span><span class="legend-dot dot-total"></span>Total RSVP</span>
            <span><span class="legend-dot dot-confirmed"></span>Confirmados</span>
        </div>
    </div>
    <div class="progress-visual">
        <div class="progress-labels">
            <span>Estado Actual</span>
            <span class="percentage-badge">{{ attendancePercentage() }}%</span>
        </div>
        <div class="progress-bar-bg">
            <!-- RSVP Bar (Pending + Confirmed) -->
            <div class="progress-bar-fill" [style.width.%]="attendancePercentage()"></div>
            <!-- Only Confirmed Bar (Overlaid) -->
            <div class="progress-bar-fill confirmed" [style.width.%]="confirmedPercentage()"></div>
        </div>
    </div>
</div>
