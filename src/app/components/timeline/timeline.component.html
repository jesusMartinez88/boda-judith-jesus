<div class="timeline-container">
  <h2 class="timeline-title">Cronograma del Día</h2>

  <div class="timeline">
    @for (event of events; track event; let last = $last) {
    <div class="timeline-item" [class.last]="last">
      <div class="timeline-marker">
        <div class="marker-dot"></div>
        <div class="marker-icon">{{ event.icon }}</div>
      </div>
      <div class="timeline-content">
        <div class="event-time">{{ event.time }}</div>
        <div class="event-card">
          <h3 class="event-title">{{ event.title }}</h3>
          <p class="event-description">{{ event.description }}</p>
          <div class="event-location">
            <a href="{{ event.locationUrl }}" target="_blank" rel="noopener" class="map-btn">
              <span class="btn-icon">📍</span><span>{{ event.location }}</span>
            </a>
          </div>
        </div>
      </div>
    </div>
    }

  </div>
</div>
