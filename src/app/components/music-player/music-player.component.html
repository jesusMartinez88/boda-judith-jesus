<!-- El reproductor se activa automáticamente tras interacción y se mantiene oculto por petición -->

<div class="music-player">
  <button class="music-toggle-btn" (click)="toggleMusic()"
    [attr.aria-label]="isPlaying() ? 'Pausar música' : 'Reproducir música'" [disabled]="!isLoaded()">
    @if (!isPlaying()) {
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon">
      <path d="M8 5v14l11-7z" />
    </svg>
    }
    @if (isPlaying()) {
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="icon">
      <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z" />
    </svg>
    }
  </button>
</div>
