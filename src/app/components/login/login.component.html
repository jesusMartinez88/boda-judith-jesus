<div class="login-container">
  <div class="login-card" aos="fade-up">
    <div class="login-header">
      <div class="logo">💍</div>
      <h1>Panel de Administración</h1>
      <p>Inicia sesión para ver las estadísticas de la boda</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Usuario</label>
        <div class="input-wrapper">
          <input type="text" id="username" formControlName="username" placeholder="Tu usuario">
          <span class="focus-border"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <input type="password" id="password" formControlName="password" placeholder="••••••••">
          <span class="focus-border"></span>
        </div>
      </div>

      <!-- CAPTCHA Section -->
      <div class="captcha-group">
        <label>Verificación</label>
        <div class="captcha-container">
          <div class="captcha-question">
            <span>¿Cuánto es</span>
            <strong class="math-problem">{{ captchaQuestion() }}</strong>
            <span>?</span>
          </div>
          <div class="input-wrapper captcha-input">
            <input type="number" formControlName="captcha" placeholder="Resultado">
            <span class="focus-border"></span>
          </div>
        </div>
        <p class="captcha-hint">Responde esta suma para continuar</p>
      </div>

      @if (errorMessage()) {
        <div class="error-message">
          {{ errorMessage() }}
        </div>
      }

      @if (loadingMessage()) {
        <div class="loading-message">
          <div class="loading-icon">⏳</div>
          <p>{{ loadingMessage() }}</p>
        </div>
      }

      <button type="submit" [disabled]="loginForm.invalid || isLoading()" class="login-btn">
        @if (!isLoading()) {
          <span>Entrar</span>
        }
        @if (isLoading()) {
          <span class="loader"></span>
        }
      </button>

      <div class="login-footer">
        <a routerLink="/" class="back-link">← Volver a la web</a>
      </div>
    </form>
  </div>
</div>
