<div class="hero">
  <div class="hero-background" #heroBackground></div>
  <canvas class="hero-particles" #particlesCanvas></canvas>
  <div class="hero-overlay" #heroOverlay></div>

  <!-- Sobre de invitación -->
  <div class="envelope-container" #envelope (click)="openEnvelope()">
    <div class="envelope">
      <!-- Decoraciones del sobre -->
      <svg class="envelope-decoration" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="lacePattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="10" cy="10" r="1" fill="#d4c4b0" opacity="0.3"/>
          </pattern>
          <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f4e4c1;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#e8d4a8;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#d4c4b0;stop-opacity:1" />
          </linearGradient>
        </defs>
        <!-- Marco decorativo -->
        <rect x="20" y="20" width="560" height="360" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.4"/>
        <rect x="30" y="30" width="540" height="340" fill="none" stroke="url(#goldGradient)" stroke-width="1" opacity="0.3"/>
        <!-- Ornamentos en las esquinas -->
        <path d="M 40 40 Q 50 40 50 50 Q 50 40 60 40" stroke="#d4c4b0" fill="none" stroke-width="1.5" opacity="0.5"/>
        <path d="M 540 40 Q 550 40 550 50 Q 550 40 560 40" stroke="#d4c4b0" fill="none" stroke-width="1.5" opacity="0.5"/>
        <path d="M 40 360 Q 50 360 50 350 Q 50 360 60 360" stroke="#d4c4b0" fill="none" stroke-width="1.5" opacity="0.5"/>
        <path d="M 540 360 Q 550 360 550 350 Q 550 360 560 360" stroke="#d4c4b0" fill="none" stroke-width="1.5" opacity="0.5"/>
      </svg>

      <div class="envelope-flap" #envelopeFlap>
        <div class="flap-top">
          <!-- Decoración de la solapa -->
          <svg class="flap-decoration" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
            <path d="M 300 180 Q 280 160 260 180 Q 240 160 220 180 Q 200 160 180 180" 
                  stroke="#c4b4a0" fill="none" stroke-width="1" opacity="0.4"/>
            <path d="M 300 180 Q 320 160 340 180 Q 360 160 380 180 Q 400 160 420 180" 
                  stroke="#c4b4a0" fill="none" stroke-width="1" opacity="0.4"/>
          </svg>
        </div>
      </div>
      
      <div class="envelope-body">
        <!-- Textura del sobre -->
        <div class="envelope-texture"></div>
      </div>
      
      <div class="envelope-paper" #envelopePaper>
        <div class="paper-content">
          <svg class="paper-decoration-top" viewBox="0 0 300 50" xmlns="http://www.w3.org/2000/svg">
            <path d="M 50 25 Q 75 15 100 25 Q 125 35 150 25 Q 175 15 200 25 Q 225 35 250 25" 
                  stroke="#be185d" fill="none" stroke-width="1.5" opacity="0.3"/>
            <circle cx="150" cy="25" r="3" fill="#be185d" opacity="0.4"/>
          </svg>
          
          <div class="paper-ornament-elegant">
            <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
              <path d="M 30 10 L 35 25 L 50 30 L 35 35 L 30 50 L 25 35 L 10 30 L 25 25 Z" 
                    fill="#be185d" opacity="0.6"/>
              <circle cx="30" cy="30" r="8" fill="none" stroke="#be185d" stroke-width="1" opacity="0.4"/>
            </svg>
          </div>
          
          <h3 class="invitation-title">Estás Invitado</h3>
          
          <div class="paper-ornament-elegant">
            <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
              <path d="M 30 10 L 35 25 L 50 30 L 35 35 L 30 50 L 25 35 L 10 30 L 25 25 Z" 
                    fill="#be185d" opacity="0.6"/>
              <circle cx="30" cy="30" r="8" fill="none" stroke="#be185d" stroke-width="1" opacity="0.4"/>
            </svg>
          </div>
          
          <svg class="paper-decoration-bottom" viewBox="0 0 300 50" xmlns="http://www.w3.org/2000/svg">
            <path d="M 50 25 Q 75 35 100 25 Q 125 15 150 25 Q 175 35 200 25 Q 225 15 250 25" 
                  stroke="#be185d" fill="none" stroke-width="1.5" opacity="0.3"/>
            <circle cx="150" cy="25" r="3" fill="#be185d" opacity="0.4"/>
          </svg>
        </div>
      </div>
      
      <!-- Sello de cera elegante -->
      <div class="envelope-seal" #envelopeSeal>
        <svg class="seal-decoration" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="sealGradient">
              <stop offset="0%" style="stop-color:#db2777;stop-opacity:1" />
              <stop offset="50%" style="stop-color:#be185d;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#9f1239;stop-opacity:1" />
            </radialGradient>
          </defs>
          <circle cx="50" cy="50" r="45" fill="url(#sealGradient)" opacity="0.3"/>
          <circle cx="50" cy="50" r="35" fill="none" stroke="#831843" stroke-width="1" opacity="0.5"/>
          <circle cx="50" cy="50" r="25" fill="none" stroke="#831843" stroke-width="0.5" opacity="0.3"/>
        </svg>
        <div class="seal-inner">J & J</div>
      </div>
      
      <!-- Fragmentos para el efecto de ruptura -->
      <div class="seal-fragment" #sealFragment1></div>
      <div class="seal-fragment" #sealFragment2></div>
      <div class="seal-fragment" #sealFragment3></div>
      <div class="seal-fragment" #sealFragment4></div>
      <div class="seal-fragment" #sealFragment5></div>
    </div>
    <p class="envelope-hint">
      <svg class="hint-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2 L12 12 M12 12 L8 8 M12 12 L16 8" stroke="white" fill="none" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="18" r="2" fill="white"/>
      </svg>
      Haz click o scroll para abrir
    </p>
  </div>

  <div class="hero-content" #heroContent>
    <div class="hero-text">
      <h1 class="hero-title" #heroTitle>Judith & Jesús</h1>
      <p class="hero-subtitle" #heroSubtitle>Nos casamos el 11 de Julio de 2026</p>
      <p class="hero-location" #heroLocation>Blanca, España</p>

      <div class="hero-countdown" #countdownWrapper>
        <app-countdown></app-countdown>
      </div>

      <a href="#rsvp" class="hero-cta" #heroCta>Confirma tu asistencia</a>
    </div>
  </div>

  <div class="hero-scroll">
    <span>Desplázate para continuar</span>
    <div class="scroll-arrow">↓</div>
  </div>
</div>
