<div class="gallery-container">
  <h2 class="gallery-title">Galería de Fotos</h2>
  <p class="gallery-subtitle">Nuestros momentos especiales</p>

  <div class="gallery-grid">
    @for (photo of photos; track photo) {
      <div
        class="gallery-item"
        (click)="openModal(photo)"
        >
        <div class="photo-placeholder">
          <img
            [src]="photo.placeholder"
            [alt]="photo.title"
            onerror="this.style.display='none'"
            />
            @if (!photo.placeholder) {
              <span>{{ photo.title }}</span>
            }
          </div>
          <p class="photo-title">{{ photo.title }}</p>
        </div>
      }
    </div>

    <!-- Modal -->
    @if (selectedPhoto) {
      <div class="modal-overlay" (click)="closeModal()">
        <div class="modal-content" (click)="$event.stopPropagation()">
          <button class="modal-close" (click)="closeModal()">✕</button>
          <div class="modal-photo">
            <img [src]="selectedPhoto.placeholder" [alt]="selectedPhoto.title" />
          </div>
          <h3>{{ selectedPhoto.title }}</h3>
          <p>Haz clic afuera para cerrar</p>
        </div>
      </div>
    }
  </div>
