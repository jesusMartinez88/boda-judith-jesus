name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. INSTALAR NODE Y PNPM
      - name: Setup Environment
        uses: ./.github/workflows/setup-pnpm

      # 2. LINT
      - name: Run Lint
        run: pnpm run lint

      # 3. BUILD
      - name: Run Build
        run: pnpm run build

      # 4. TEST
      - name: Run Tests
        run: pnpm test
