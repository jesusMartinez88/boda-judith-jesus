name: Build & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Build job
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install dependencies
        run: npm install
      - name: Debug Environment Variable
        run: |
          if [ -z "$NG_APP_SHEETURL" ]; then
            echo "LA VARIABLE ESTÁ VACÍA"
            exit 1
          else
            echo "La variable tiene contenido y mide ${#NG_APP_SHEETURL} caracteres."
            # Cuidado: la siguiente línea mostrará el valor en el log si es una VARIABLE (no secret)
            echo "Valor: $NG_APP_SHEETURL"
          fi
        env:
          NG_APP_SHEETURL: ${{ secrets.NG_APP_SHEETURL }}
      - name: Inject URL into index.html
        run: |
          sed -i "s|<head>|<head><script>window.NG_APP_SHEETURL='${{ secrets.NG_APP_SHEETURL }}';</script>|g" src/index.html
      - name: Build
        run: npm run build -- --configuration production --base-href /boda-judith-jesus/
        env:
          NG_APP_SHEETURL: ${{ secrets.NG_APP_SHEETURL }}
      - name: Deploy to Github pages
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npm run ng -- deploy --repo=https://github.com/jesusMartinez88/boda-judith-jesus.git --name="jesusMartinez88" --email="jesus.martinez.88@gmail.com" --base-href=/boda-judith-jesus/
